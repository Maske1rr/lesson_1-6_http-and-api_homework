<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Стартовый интерфейс домашней работы по HTTP и REST API"
    />
    <title>API-витрина</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header__content">
        <p class="page-header__eyebrow">ДЗ 6 · HTTP и API</p>
        <h1 class="page-header__title">API-витрина</h1>
      </div>
    </header>

    <main class="workspace">
      <section class="panel panel--collection" aria-labelledby="collection-title">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Коллекция</p>
            <h2 class="panel__title" id="collection-title">Объекты из API</h2>
          </div>

          <button class="button button--secondary" type="button" data-action="reload">
            Обновить
          </button>
        </div>

        <p class="endpoint">
          Endpoint:
          <code class="endpoint__value" data-ui="endpoint">http://localhost:3000/movies</code>
        </p>

        <div class="status" data-ui="status" role="status" aria-live="polite">
          <strong class="status__title">Ожидание подключения</strong>
          <span class="status__text"></span>
        </div>

        <div class="collection" data-ui="collection" aria-live="polite"></div>
      </section>

      <section class="panel panel--form" aria-labelledby="form-title">
        <div class="panel__header">
          <div>
            <p class="panel__eyebrow">Новая запись</p>
            <h2 class="panel__title" id="form-title">Добавить объект</h2>
          </div>
        </div>

        <form class="entry-form" data-form="entry">
          <div class="field">
            <label class="field__label" for="entry-title">Название</label>
            <input
              class="field__control"
              id="entry-title"
              name="title"
              type="text"
              minlength="2"
              placeholder="Название фильма"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="entry-genre">Жанр</label>
            <select class="field__control" id="entry-genre" name="genre" required>
              <option value="">Выберите жанр</option>
              <option value="Боевик">Боевик</option>
              <option value="Фантастика">Фантастика</option>
              <option value="Приключения">Приключения</option>
              <option value="Драма">Драма</option>
              <option value="Мелодрама">Мелодрама</option>
              <option value="Комедия">Комедия</option>
              <option value="Триллер">Триллер</option>
              <option value="Ужасы">Ужасы</option>
              <option value="Детектив">Детектив</option>
              <option value="Вестерн">Вестерн</option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="entry-year">Год выхода</label>
            <input
              class="field__control"
              id="entry-year"
              name="year"
              type="number"
              min="1895"
              max="2030"
              step="1"
              placeholder="Год выхода фильма"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="entry-rating">Рейтинг</label>
            <input
              class="field__control"
              id="entry-rating"
              name="rating"
              type="number"
              min="1"
              max="10"
              step="0.1"
              placeholder="Рейтинг от 1 до 10"
              required
            />
          </div>

          <div class="field field--checkbox">
            <input class="field__checkbox" id="entry-watched" name="watched" type="checkbox" />
            <label class="field__label" for="entry-watched">Уже посмотрел</label>
          </div>

          <p
            class="entry-form__message"
            data-ui="form-message"
            role="status"
            aria-live="polite"
            hidden
          ></p>

          <div class="entry-form__actions">
            <button class="button button--primary" type="submit" data-action="submit">
              Отправить в API
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
